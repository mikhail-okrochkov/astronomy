[project]
name = "astronomy"
version = "0.1.0"
description = "Astronomical simulations, built to be correct and good-looking enough to write about."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM"]
ignore = ["SIM300"]  # flags `SI.G == approx(...)` as a Yoda condition

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
